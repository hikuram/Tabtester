x-model-cache-environment: &model-cache-environment
  HF_HOME: /models/huggingface
  TORCH_HOME: /models/torch
  XDG_CACHE_HOME: /models/xdg
  HF_HUB_DISABLE_TELEMETRY: "1"
  TABTESTER_MODEL_CACHE: /models

services:
  tabtester:
    build:
      context: .
    image: tabtester:local
    init: true
    ports:
      - "8501:8501"
    shm_size: "2gb"
    environment:
      <<: *model-cache-environment
      HF_HUB_OFFLINE: "1"
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    volumes:
      - model-cache:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  model-prefetch:
    profiles: ["tools"]
    build:
      context: .
    image: tabtester:local
    init: true
    environment:
      <<: *model-cache-environment
      HF_HUB_OFFLINE: "0"
      PREFETCH_FOUNDATION_MODELS: "tabicl"
      ACCEPT_TABFM_LICENSE: "0"
    volumes:
      - model-cache:/models
    command: ["python", "scripts/warmup_models.py"]

volumes:
  model-cache:

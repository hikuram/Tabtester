services:
  tabtester:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nvcr.io/nvidia/pytorch:26.05-py3}
        PREFETCH_FOUNDATION_MODELS: ${PREFETCH_FOUNDATION_MODELS:-tabicl}
        ACCEPT_TABFM_LICENSE: ${ACCEPT_TABFM_LICENSE:-0}
        ENABLE_JAPANESE_SUPPORT: ${ENABLE_JAPANESE_SUPPORT:-0}
    image: tabtester:local
    init: true
    ports:
      - "${TABTESTER_PORT:-8501}:8501"
    shm_size: "2gb"
    environment:
      HF_HOME: /opt/tabtester/huggingface
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-1}"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TABFM_CHECKPOINT_PATH: "${TABFM_CHECKPOINT_PATH:-}"
      ENABLE_JAPANESE_SUPPORT: "${ENABLE_JAPANESE_SUPPORT:-0}"
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

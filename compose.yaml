services:
  tabtester:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nvcr.io/nvidia/pytorch:24.12-py3}
    image: tabtester:local
    ports:
      - "${TABTESTER_PORT:-8501}:8501"
    shm_size: "2gb"
    environment:
      HF_HOME: /models/huggingface
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      HF_HUB_DISABLE_TELEMETRY: "1"
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - tabtester_hf_cache:/models/huggingface
    restart: unless-stopped

volumes:
  tabtester_hf_cache:
